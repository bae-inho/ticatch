services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ticatch
      POSTGRES_USER: ticatch
      POSTGRES_PASSWORD: ticatch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticatch -d ticatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
